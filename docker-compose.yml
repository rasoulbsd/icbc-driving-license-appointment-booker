version: '3.8'

services:
  backend:
    build: ./backend
    container_name: icbc-backend
    restart: always
    env_file: ./.env
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    networks:
      - app_network

  bot:
    build: ./bot
    container_name: icbc-bot
    restart: always
    env_file: ./.env
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge