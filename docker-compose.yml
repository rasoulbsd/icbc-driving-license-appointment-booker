version: '3.8'

services:
  backend:
    build: ./backend
    container_name: icbc-backend
    restart: always
    env_file: ./.env
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  bot:
    build: ./bot
    container_name: icbc-bot
    restart: always
    env_file: ./.env
    environment:
      - DOCKER_ENV=true
      - IN_DOCKER=true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge